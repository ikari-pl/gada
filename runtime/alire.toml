name = "gada_core"
description = "GADA core runtime library - umbrella Gada and Gada.Core."
version = "0.0.0-dev"

authors = ["GADA contributors"]
maintainers = ["cezar@pokor.ski"]
maintainers-logins = []
licenses = "Unlicense"
website = ""
tags = ["runtime", "ada", "go", "transpiler"]

project-files = ["gada_core.gpr"]

# AUnit is needed by the test harness in `tests/aunit_harness.gpr`. It is
# a test-only dependency - runtime users do not need it. Alire 2.x has
# no first-class `[test-dependencies]` table, so it lives in the regular
# `[[depends-on]]` until we move tests into a sub-crate.
[[depends-on]]
aunit = "^26.0.0"

# gnatprove is the SPARK formal-verification toolchain. Pinned per
# docs/adr/0008-spark-policy.md so `cd runtime && alr build` materialises
# the binary into the Alire-managed PATH, after which `tools/prove.sh`
# discharges every VC on every SPARK opt-in unit (currently just
# Gada.Core.Hash). Listed under [[depends-on]] because Alire 2.x has no
# first-class test/dev-dependencies table; the `Auto_Gpr_With = false`
# in the gnatprove crate metadata means it does not auto-import as a
# library, only puts the binary on PATH via the crate's environment
# entry. See `alr show gnatprove` for details.
#
# Exact-pinned (not caret) because formal-verification proof results
# can vary between gnatprove versions ("proof drift"). A 15.2.0 that
# tightens a prover heuristic could fail to discharge a VC that 15.1.0
# discharged trivially -- that's a real CI surprise, not a hypothetical.
# The cost of an exact pin is one explicit version-bump PR per upgrade,
# which is the right cadence for a verifier.
[[depends-on]]
gnatprove = "15.1.0"
