# tools/coverage_thresholds.toml
#
# Per-path minimum line-coverage thresholds enforced by tools/coverage_gate.sh.
# The gate aggregates coverage across every file whose repo-relative path
# starts with the threshold's `path` prefix, and fails when the aggregate
# slips below `minimum_lines_pct`.
#
# Matching is overlapping by design: a file under
# `compiler/internal/emit/` counts toward BOTH the emit/ threshold AND
# the parent compiler/ threshold. This catches the case where a deep
# package regresses while the broad average still looks acceptable.
#
# Numbers come from AGENTS.md "Design principles -> Every behavior is
# unit-tested before it ships":
#   - 100% executable lines for runtime/ packages
#   - >= 90% for compiler/ packages
#   - >= 95% for AST emission and translation layers
# Update this file (and AGENTS.md alongside) if those numbers change.
#
# Per-file line exclusions: `[[exclude]]` entries name a single file
# plus a list of line numbers that the gate should drop from BOTH the
# numerator and denominator before computing per-threshold percentages.
# This is the documented escape valve from AGENTS.md ("Deviations are
# documented per package in `runtime/<package>/COVERAGE.md` with
# rationale and an explicit reviewer-approved exception"). Use sparingly
# and *only* for code that is genuinely untestable in CI (e.g. malloc
# OOM paths under overcommit-on Linux). Each entry MUST point at the
# package's COVERAGE.md so a future reader can audit the rationale.

[[threshold]]
path = "runtime/"
minimum_lines_pct = 100.0

[[threshold]]
path = "compiler/internal/emit/"
minimum_lines_pct = 95.0

[[threshold]]
path = "compiler/internal/translate/"
minimum_lines_pct = 95.0

[[threshold]]
path = "compiler/"
minimum_lines_pct = 90.0

# --- per-file exclusions ---------------------------------------------------

# libco's malloc-based co_create returns NULL only on hard allocation
# failure; on Linux with overcommit and macOS arm64 with large-VA there
# is no portable Stack_Size value that *deterministically* triggers it.
# The defensive raise (Storage_Error on Null_Cothread) is one statement
# guarded by a deterministic equality test — review of the surrounding
# code is sufficient. Phase 3 item 3 (scheduler) will gain a fault-
# injection seam that re-covers this branch.
# Rationale: runtime/COVERAGE.md (gada-async-context).
[[exclude]]
file = "runtime/src/gada-async-context.adb"
lines = [243, 244]
reason = "libco co_create OOM path — see runtime/COVERAGE.md"

# Implicit basic block at the bottom of Trampoline's infinite tail loop.
# The procedure is `pragma No_Return` and the loop has no exit branch;
# control never reaches `end loop;` under any normal flow. gcov still
# instruments the line as a no-return basic block — exclude it so the
# 100% gate isn't gated on unreachable code.
# Rationale: runtime/COVERAGE.md (gada-async-context).
[[exclude]]
file = "runtime/src/gada-async-context.adb"
lines = [215]
reason = "Trampoline tail-loop end — unreachable, see runtime/COVERAGE.md"

# Trampoline's `when E : others =>` arm catches Ada exceptions raised
# from the user's entry procedure so they don't propagate across the
# C ABI boundary (Convention => C; libco invokes us via a void(*)(void)
# function pointer, and unwinding across that frame is undefined).
# Triggering it from a unit test is a chicken-and-egg problem: the only
# code that runs on a libco cothread under this body IS the trampoline,
# so a "raising" entry would have to be installed by the same Make path
# we're testing. Phase 3's Goroutine_Trampoline (sub-item 3a, already
# in this PR) will introduce a panic-injection seam that re-covers
# these lines from one layer up. (PR #3 review feedback.)
# Rationale: runtime/COVERAGE.md (gada-async-context).
[[exclude]]
file = "runtime/src/gada-async-context.adb"
lines = [197, 198, 202]
reason = "Trampoline C-boundary exception arm — see runtime/COVERAGE.md"

# Init's per-worker `new Worker_Task` rollback arm. Triggering it
# requires Storage_Error or Tasking_Error from the Ada task allocation,
# which the Alire FSF GNAT 15.1 runtime does not expose a portable
# hook for. The Phase 3 sub-item (c) work-stealing expansion will add
# a worker-pool fault-injection switch (per docs/incidents/2026-05-03-
# scheduler-3b-multi-worker-race.md follow-ups) that re-covers this
# rollback. Until then, the seven-statement arm is straightforward
# enough for a code-review pass. (PR #3 review feedback, lifted to the
# multi-worker shape in 3b.) Rationale: runtime/COVERAGE.md
# (gada-async-scheduler).
[[exclude]]
file = "runtime/src/gada-async-scheduler.adb"
lines = [555, 556, 557, 558, 559, 560, 561]
reason = "Init Worker_Task allocation rollback — see runtime/COVERAGE.md"

# Spawn's `Make` failure leak guard. Same fault-injection prerequisite
# as Init's rollback above (libco co_create OOM path is itself excluded
# at gada-async-context.adb:243 for the same portability reason). When
# the Phase 3 fault-injection seam lands it will re-cover both the
# raise *and* this Free_Goroutine cleanup arm in a single test.
# (PR #3 review feedback.) Rationale: runtime/COVERAGE.md
# (gada-async-scheduler).
[[exclude]]
file = "runtime/src/gada-async-scheduler.adb"
lines = [606, 607, 608]
reason = "Spawn Make-failure leak guard — see runtime/COVERAGE.md"

# Park_Sender's race-recheck arm: between the caller's
# Try_Buffered_Send (which already returned Was_Closed = False) and
# Park_Sender's own Closed_F test, a concurrent third party would have
# to call Close. With one worker and a deterministic test that owns the
# Send's protected-call sequence, no other actor can interpose. The
# arm exists for the multi-worker race window — Phase 3 sub-item 3b
# already proved >=2 workers under stress, but the *race itself*
# requires a Send + Close from distinct goroutines AND the protected
# scheduler to suspend Send between Try_Buffered_Send return and
# Park_Sender call. GNAT's protected calls are uninterruptible, so the
# only window is the Ada source-line gap between the two calls. A
# fault-injection seam between Try_Buffered_Send and Park_Sender
# (Phase 4 panic-marshalling work) will re-cover this. Two lines.
# Rationale: runtime/COVERAGE.md (gada-async-channels-bounded).
[[exclude]]
file = "runtime/src/gada-async-channels-bounded.adb"
lines = [436, 437]
reason = "Send Park_Sender close-race recheck — see runtime/COVERAGE.md"

# Park_Receiver's race-recheck arms (Got=True / Closed=True). Mirror of
# the Send-side race-window exclusion above: between Try_Buffered_
# Receive returning empty-and-open and Park_Receiver's own Count > 0
# / Closed_F tests, a concurrent third party would have to call Send
# or Close. Deterministic single-worker tests cannot interpose. Same
# Phase 4 fault-injection seam removes both. Six lines (two
# 3-line arms: Free_Slot/OK:=Bool/return).
# Rationale: runtime/COVERAGE.md (gada-async-channels-bounded).
[[exclude]]
file = "runtime/src/gada-async-channels-bounded.adb"
lines = [502, 503, 504, 507, 508, 509]
reason = "Receive Park_Receiver send/close-race recheck — see runtime/COVERAGE.md"

# Channels.Unbounded mirror of the Channels.Bounded Park_Receiver
# race-recheck exclusion above. Same single-worker-determinism
# constraint, same Phase 4 fault-injection seam closes both. Six lines
# (two 3-line arms: Free_Slot/OK:=Bool/return). The Send-side mirror
# is intentionally absent — Unbounded.Send never blocks, so there is
# no Park_Sender close-race-recheck arm to exclude.
# Rationale: runtime/COVERAGE.md (gada-async-channels-unbounded).
[[exclude]]
file = "runtime/src/gada-async-channels-unbounded.adb"
lines = [405, 406, 407, 410, 411, 412]
reason = "Receive Park_Receiver send/close-race recheck — see runtime/COVERAGE.md"

# Selector defensive / unreachable lines (line numbers adjusted in
# 8e0bf22 and follow-ups for Gemini PR #6 R2 review — the body
# grew the Default_Element formal init plus the package-private
# Seed_Counter declaration block):
#   102 — Shuffle's "J := I" float-rounding cap. Random (Gen) is
#         clamped to [0, 1) so Float'Floor (Random * Float (N)) is
#         always < N — but Ada.Numerics.Float_Random's spec leaves
#         the half-open boundary implementation-defined, and a
#         future float-rounding regression on a non-IEEE target
#         could land exactly at 1.0. The clamp is one statement,
#         deterministic, and self-evidently correct on review.
#   107 — `end loop;` of Shuffle's outer for-loop. Implicit basic
#         block at the iteration end; gcov instruments it as
#         executable but it's the loop's own terminator.
#   163, 164, 165 — Try_One_Case's `when Default_Op | Timeout_Op =>
#         Fired := False; end case;` arm. Unreachable from Select_
#         One because the outer loop filters those kinds before
#         calling Try_One_Case. Kept for Ada exhaustiveness; the
#         `Fired := False` write is defensive belt-and-braces.
#   306 — `end;` of Select_One's inner declare block, after the
#         infinite `loop ... end loop;`. The loop only exits via
#         `return`; the end-block is never reached. Unreachable
#         terminator in the same shape as Gada.Async.Context's
#         Trampoline tail loop (gada-async-context.adb:215). Shifted
#         from 304 to 306 in the Ada 2022 sweep — Select_One's
#         Order identity-initialisation became an iterated component
#         association (`Order : Index_Array (...) := [for I in ... =>
#         ...]`) and the polling loop adopted Ada 2022's iterator
#         filter (`for I in Order'Range when ... loop`), trimming
#         two lines net while making the structure read directly as
#         "permutation indices, skipping Default/Timeout cases".
# Rationale: runtime/COVERAGE.md (gada-async-selector).
[[exclude]]
file = "runtime/src/gada-async-selector.adb"
lines = [102, 107, 163, 164, 165, 306]
reason = "Selector defensive/unreachable arms — see runtime/COVERAGE.md"
