# tools/coverage_thresholds.toml
#
# Per-path minimum line-coverage thresholds enforced by tools/coverage_gate.sh.
# The gate aggregates coverage across every file whose repo-relative path
# starts with the threshold's `path` prefix, and fails when the aggregate
# slips below `minimum_lines_pct`.
#
# Matching is overlapping by design: a file under
# `compiler/internal/emit/` counts toward BOTH the emit/ threshold AND
# the parent compiler/ threshold. This catches the case where a deep
# package regresses while the broad average still looks acceptable.
#
# Numbers come from AGENTS.md "Design principles -> Every behavior is
# unit-tested before it ships":
#   - 100% executable lines for runtime/ packages
#   - >= 90% for compiler/ packages
#   - >= 95% for AST emission and translation layers
# Update this file (and AGENTS.md alongside) if those numbers change.
#
# Per-file line exclusions: `[[exclude]]` entries name a single file
# plus a list of line numbers that the gate should drop from BOTH the
# numerator and denominator before computing per-threshold percentages.
# This is the documented escape valve from AGENTS.md ("Deviations are
# documented per package in `runtime/<package>/COVERAGE.md` with
# rationale and an explicit reviewer-approved exception"). Use sparingly
# and *only* for code that is genuinely untestable in CI (e.g. malloc
# OOM paths under overcommit-on Linux). Each entry MUST point at the
# package's COVERAGE.md so a future reader can audit the rationale.

[[threshold]]
path = "runtime/"
minimum_lines_pct = 100.0

[[threshold]]
path = "compiler/internal/emit/"
minimum_lines_pct = 95.0

[[threshold]]
path = "compiler/internal/translate/"
minimum_lines_pct = 95.0

[[threshold]]
path = "compiler/"
minimum_lines_pct = 90.0

# --- per-file exclusions ---------------------------------------------------

# libco's malloc-based co_create returns NULL only on hard allocation
# failure; on Linux with overcommit and macOS arm64 with large-VA there
# is no portable Stack_Size value that *deterministically* triggers it.
# The defensive raise (Storage_Error on Null_Cothread) is one statement
# guarded by a deterministic equality test — review of the surrounding
# code is sufficient. Phase 3 item 3 (scheduler) will gain a fault-
# injection seam that re-covers this branch.
# Rationale: runtime/COVERAGE.md (gada-async-context).
[[exclude]]
file = "runtime/src/gada-async-context.adb"
lines = [139, 140]
reason = "libco co_create OOM path — see runtime/COVERAGE.md"

# Implicit basic block at the bottom of Trampoline's infinite tail loop.
# The procedure is `pragma No_Return` and the loop has no exit branch;
# control never reaches `end loop;` under any normal flow. gcov still
# instruments the line as a no-return basic block — exclude it so the
# 100% gate isn't gated on unreachable code.
# Rationale: runtime/COVERAGE.md (gada-async-context).
[[exclude]]
file = "runtime/src/gada-async-context.adb"
lines = [111]
reason = "Trampoline tail-loop end — unreachable, see runtime/COVERAGE.md"
